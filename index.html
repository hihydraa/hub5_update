<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KC Location Analysis Leaflet</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html,body,#map{
    height:100%;
    margin:0;
}

#map{
    width:100%;
}

#dashboard{
    position:absolute;
    z-index:999;
    top:10px;
    left:10px;
    width:300px;
    max-height:calc(100% - 40px);
    overflow-y:auto;
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 0 10px #888;
    font-family:Arial, "Noto Sans Thai", sans-serif;
    font-size:14px;
}

#dashboard hr{
    border:0;
    border-top:1px solid #ddd;
    margin:10px 0;
}

button{
    width:100%;
    padding:8px;
    margin:4px 0;
    border:0;
    border-radius:5px;
    background:#1565c0;
    color:white;
    cursor:pointer;
}

button.off{
    background:#9e9e9e;
}

.row2{
    display:flex;
    gap:6px;
}

.row2 button{
    margin:4px 0;
}

.group-title{
    font-weight:bold;
    margin:6px 0 4px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.group-title span.mini{
    font-weight:normal;
    font-size:12px;
}

.group-title a{
    color:#1565c0;
    cursor:pointer;
    text-decoration:underline;
    margin-left:6px;
}

.pt{
    display:flex;
    align-items:center;
    gap:6px;
    padding:3px 0;
}

.pt label{
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
    flex:1;
}

.pt .dot{
    width:11px;
    height:11px;
    border-radius:50%;
    display:inline-block;
    flex:none;
}

.pt .ring{
    font-size:12px;
    color:#555;
    display:flex;
    align-items:center;
    gap:3px;
    cursor:pointer;
}

.pt-label{
    background:rgba(255,255,255,.92);
    border:1px solid #888;
    border-radius:4px;
    padding:1px 5px;
    font-family:Arial, "Noto Sans Thai", sans-serif;
    font-size:12px;
    font-weight:bold;
    box-shadow:none;
}

#info{
    font-size:12px;
    color:#555;
    margin-top:6px;
}

/* ================= โครงหน้า (ปกติ = เต็มจอ) ================= */

#stage,#sheet{
    height:100%;
}

#sheet{
    display:flex;
    flex-direction:column;
    background:#fff;
}

#sheet #map{
    flex:1;
    height:auto;
    min-height:0;
}

#sheetHead,#sheetFoot,#toolbar,#northArrow{
    display:none;
}

/* ================= โหมดพิมพ์ A2 (594 x 420 มม. แนวนอน) ================= */

body.print-mode{
    background:#5f6368;
    overflow:auto;
    font-family:Arial, "Noto Sans Thai", sans-serif;
}

body.print-mode #dashboard{
    display:none;
}

body.print-mode #toolbar{
    display:flex;
    position:fixed;
    top:0; left:0; right:0;
    height:44px;
    z-index:3000;
    background:#202124;
    color:#fff;
    align-items:center;
    gap:8px;
    padding:0 12px;
    font-size:14px;
}

body.print-mode #toolbar button{
    width:auto;
    margin:0;
    padding:7px 12px;
    background:#3c4043;
}

body.print-mode #toolbar button.active{
    background:#1565c0;
}

body.print-mode #toolbar button.go{
    background:#2e7d32;
    margin-left:auto;
}

body.print-mode #stage{
    position:relative;
    height:auto;
    margin:56px auto 20px;
}

body.print-mode #sheet{
    position:absolute;
    top:0; left:0;
    width:594mm;
    height:419mm;
    overflow:hidden;
    transform-origin:0 0;
    transform:scale(var(--s,1));
    box-shadow:0 0 12px #000;
    box-sizing:border-box;
    padding:9mm 10mm 9mm;
}

body.print-mode #sheetHead{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    padding-bottom:3mm;
    border-bottom:.6mm solid #222;
    margin-bottom:3mm;
}

body.print-mode #sheetHead h1{
    margin:0;
    font-size:9mm;
    line-height:1.1;
}

body.print-mode #sheetHead .sub{
    font-size:4mm;
    color:#444;
    margin-top:1.5mm;
}

body.print-mode #sheetHead .right{
    text-align:right;
    font-size:4mm;
    color:#333;
    line-height:1.5;
}

body.print-mode #sheet #map{
    border:.4mm solid #222;
    position:relative;
}

body.print-mode #sheetFoot{
    display:block;
    margin-top:3mm;
}

.foot-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:2mm;
}

.card{
    display:flex;
    gap:2mm;
    border:.3mm solid #999;
    border-radius:1mm;
    padding:1.5mm;
    font-size:3.3mm;
    line-height:1.3;
    align-items:flex-start;
}

.card .qr{
    width:17mm;
    height:17mm;
    flex:none;
}

.card .qr svg{
    width:100%;
    height:100%;
    display:block;
}

.card .no{
    display:inline-block;
    min-width:5mm;
    text-align:center;
    color:#fff;
    border-radius:1mm;
    padding:0 1mm;
    font-weight:bold;
    margin-right:1mm;
}

.card .nm{
    font-weight:bold;
    font-size:3.8mm;
}

.card .mut{
    color:#555;
}

.card .warn{
    color:#b71c1c;
    font-weight:bold;
}

.foot-note{
    margin-top:2mm;
    font-size:3.2mm;
    color:#555;
    display:flex;
    justify-content:space-between;
}

body.print-mode .pt-label{
    font-size:5mm;
    padding:.4mm 1.6mm;
    border:.3mm solid #444;
}

.amp-label{
    background:none;
    border:0;
}

.amp-t{
    position:absolute;
    transform:translate(-50%,-50%);
    white-space:nowrap;
    font-family:Arial, "Noto Sans Thai", sans-serif;
    font-size:3.8mm;
    font-weight:600;
    color:#37474f;
    text-shadow:0 0 1.2mm #fff, 0 0 1.2mm #fff, 0 0 1.2mm #fff;
}

body.print-mode .leaflet-control-zoom{
    display:none;
}

body.print-mode .leaflet-control-scale-line{
    font-size:4mm;
    border-width:.6mm;
    background:rgba(255,255,255,.9);
}

body.print-mode #northArrow{
    display:block;
    position:absolute;
    top:5mm;
    right:5mm;
    z-index:1000;
    width:16mm;
    background:rgba(255,255,255,.9);
    border:.3mm solid #444;
    border-radius:1mm;
    text-align:center;
    font-weight:bold;
    font-size:5mm;
    line-height:1;
    padding:1mm 0;
}

@media print{

    html,body{
        height:auto !important;
        overflow:visible !important;
    }

    body.print-mode{
        background:#fff;
    }

    body.print-mode #toolbar{
        display:none !important;
    }

    body.print-mode #stage{
        margin:0 !important;
        width:594mm !important;
        height:419mm !important;
    }

    body.print-mode #sheet{
        transform:none !important;
        box-shadow:none;
    }

    body.print-mode *{
        -webkit-print-color-adjust:exact;
        print-color-adjust:exact;
    }
}
</style>

</head>

<script>

const map = L.map('map').setView([15.8,102.8],8);

const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,
    attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);


/* ---------- ข้อมูลจุด ---------- */

const targets=[
    ["ด่านขุนทด",15.229674,101.779315],
    ["หนองบัวตะเกียด",15.293108657176782,101.81087126460163],
    ["หนองกราด",15.35786365252799,101.68660911066699],
    ["ธารปราสาท",15.222493202715457,102.36249218396031],
    ["สีคิ้ว",14.918396902178808,101.69588802390821],
    ["ประทาย",15.548779864748118,102.70333262449823],
    ["บัวใหญ่",15.611245466671665,102.44792294125068],
    ["ปั๊มให้เช่า สีดา",15.525777647736012,102.54328018222795]
];

const stations=[
    ["ST",16.381029272179042,103.34881852164082,"red"],
    ["KN",16.71600409911031,103.08205194412724,"green"],
    ["MUK",16.43599207530131,104.61612804232725,"purple"],
    ["WNN",17.6293190999291,103.7676571040772,"orange"]
];

const RADIUS_M = 80000;
const TARGET_COLOR = "#0066ff";


/* ---------- สถานะ ---------- */

// แต่ละจุดมี marker + วงรัศมี และสถานะเปิด/ปิดเป็นของตัวเอง
const items = [];              // {id, group, name, color, marker, circle, show, ring}
let showLabels = true;
let showRadiusAll = true;

const geo = {province:null, district:null};


/* ---------- สร้างจุดทั้งหมด ---------- */

function makeItem(group, name, lat, lng, color, radiusPx){

    const marker = L.circleMarker([lat,lng],{
        radius:radiusPx,
        color:color,
        fillColor:color,
        fillOpacity:1
    });

    marker.bindPopup(
        (group==="station" ? "KC " : "พื้นที่เป้าหมาย : ") + name
        + "<br><small>" + lat.toFixed(5) + ", " + lng.toFixed(5) + "</small>"
    );

    // label ติดกับจุด (ไม่ต้องคลิก)
    marker.bindTooltip(
        group==="station" ? "KC "+name : name,
        {permanent:true, direction:"right", offset:[10,0], className:"pt-label"}
    );

    const circle = L.circle([lat,lng],{
        radius:RADIUS_M,
        color:color,
        fillColor:color,
        fillOpacity: group==="station" ? .12 : .15,
        interactive:false
    });

    const it = {
        id: items.length,
        group, name, color, marker, circle,
        lat, lng,
        r0: radiusPx,
        fill0: group==="station" ? .12 : .15,
        label0: group==="station" ? "KC "+name : name,
        no: null,
        show:true,
        ring:true
    };

    items.push(it);
    return it;
}

targets.forEach(t=>makeItem("target", t[0], t[1], t[2], TARGET_COLOR, 7));
stations.forEach(s=>makeItem("station", s[0], s[1], s[2], s[3], 9));

// เลขลำดับของจุดเป้าหมาย (ใช้อ้างอิงตรงกันทุกแผ่นพิมพ์)
items.filter(i=>i.group==="target").forEach((i,n)=>i.no=n+1);

L.control.scale({imperial:false, maxWidth:300, position:"bottomleft"}).addTo(map);


/* ---------- วาดตามสถานะ ---------- */

function refreshItem(it){

    // จุด + label
    if(it.show){
        if(!map.hasLayer(it.marker)) it.marker.addTo(map);
    }else{
        if(map.hasLayer(it.marker)) map.removeLayer(it.marker);
    }

    // วงรัศมี : ต้องเปิดจุด + เปิดวงรายจุด + เปิดวงรวม
    const wantRing = it.show && it.ring && showRadiusAll;
    if(wantRing){
        if(!map.hasLayer(it.circle)) it.circle.addTo(map);
    }else{
        if(map.hasLayer(it.circle)) map.removeLayer(it.circle);
    }

    // label
    if(it.show){
        if(showLabels) it.marker.openTooltip();
        else it.marker.closeTooltip();
    }
}

function refreshAll(){
    items.forEach(refreshItem);
    syncControls();
    updateInfo();
}


/* ---------- รายการ checkbox รายจุด ---------- */

function buildList(group, elId){

    const box = document.getElementById(elId);
    box.innerHTML = "";

    items.filter(i=>i.group===group).forEach(it=>{

        const row = document.createElement("div");
        row.className = "pt";

        row.innerHTML =
            '<label>' +
                '<input type="checkbox" data-role="show" data-id="'+it.id+'">' +
                '<span class="dot" style="background:'+it.color+'"></span>' +
                '<span>'+(group==="station" ? "KC "+it.name : it.name)+'</span>' +
            '</label>' +
            '<label class="ring" title="เปิด/ปิด วงรัศมี 80 กม. ของจุดนี้">' +
                '<input type="checkbox" data-role="ring" data-id="'+it.id+'">วง' +
            '</label>';

        box.appendChild(row);
    });
}

document.getElementById("dashboard").addEventListener("change",e=>{

    const role = e.target.dataset.role;
    if(!role) return;

    const it = items[+e.target.dataset.id];

    if(role==="show") it.show = e.target.checked;
    if(role==="ring") it.ring = e.target.checked;

    refreshAll();
});

// อัปเดต checkbox ให้ตรงกับสถานะจริง (เช่น หลังกดปุ่ม scenario)
function syncControls(){

    document.querySelectorAll("input[data-role]").forEach(cb=>{
        const it = items[+cb.dataset.id];
        cb.checked = cb.dataset.role==="show" ? it.show : it.ring;
        if(cb.dataset.role==="ring") cb.disabled = !it.show;
    });

    setBtn("btnLabel", showLabels, "Label");
    setBtn("btnRadius", showRadiusAll, "วงรัศมี 80 กม.");
}

function setBtn(id, on, text){
    const b = document.getElementById(id);
    b.textContent = text + " : " + (on ? "เปิด" : "ปิด");
    b.classList.toggle("off", !on);
}

function updateInfo(){
    const on = items.filter(i=>i.show).length;
    document.getElementById("info").innerHTML =
        "แสดงอยู่ " + on + " / " + items.length + " จุด";
}


/* ---------- ปุ่มควบคุม ---------- */

function toggleLabels(){
    showLabels = !showLabels;
    refreshAll();
}

function toggleAllRadius(){
    showRadiusAll = !showRadiusAll;
    refreshAll();
}

function setGroup(group, on){
    items.filter(i=>i.group===group).forEach(i=>i.show=on);
    refreshAll();
}

function showScenario(type){

    items.forEach(i=>{
        i.ring = true;
        if(type==="all")    i.show = true;
        if(type==="kc")     i.show = i.group==="station";
        if(type==="target") i.show = i.group==="target";
    });

    showRadiusAll = true;
    refreshAll();

    const msg = {
        all:"แสดงทั้งหมด",
        kc:"KC Existing : ST KN MUK WNN",
        target:"พื้นที่เป้าหมาย Radius 80 km"
    }[type];

    document.getElementById("info").innerHTML = msg;
}


/* ---------- GeoJSON ---------- */

function loadGeo(key, url, btnId, styleObj, labelPrefix, propKeys){

    fetch(url)
    .then(r=>{
        if(!r.ok) throw new Error(r.status);
        return r.json();
    })
    .then(data=>{

        if(!data.features || !data.features.length)
            throw new Error("ไฟล์ว่าง");

        geo[key] = L.geoJSON(data,{
            style:styleObj,
            onEachFeature:(f,l)=>{
                const p = f.properties || {};
                let name = "ไม่พบชื่อ";
                for(const k of propKeys){
                    if(p[k]){ name = p[k]; break; }
                }
                l.bindPopup(labelPrefix + " : " + name);
            }
        });

        // ให้ชั้นแผนที่อยู่ใต้จุดเสมอ
        geo[key].addTo(map);
        geo[key].bringToBack();
        document.getElementById(btnId).classList.remove("off");
    })
    .catch(err=>{
        console.warn("โหลด "+url+" ไม่สำเร็จ:", err);
        const b = document.getElementById(btnId);
        b.disabled = true;
        b.style.opacity = .5;
        b.title = "โหลดไฟล์ไม่สำเร็จ / ไฟล์ว่าง";
        b.textContent += " (ไม่มีข้อมูล)";
    });
}

loadGeo("province","data/thailand_province.geojson","btnProvince",
    {color:"#0057b8", weight:1, fillOpacity:0.05},
    "จังหวัด", ["pro_th","NAME_1","name"]);

loadGeo("district","data/thailand_amphoe.geojson","btnDistrict",
    {color:"#777", weight:.5, fillOpacity:0},
    "อำเภอ", ["amp_th","NAME_2","name"]);


function toggleGeo(type){

    const g = geo[type];
    if(!g) return;

    const btn = document.getElementById(type==="province" ? "btnProvince" : "btnDistrict");

    if(map.hasLayer(g)){
        map.removeLayer(g);
        btn.classList.add("off");
    }else{
        g.addTo(map);
        g.bringToBack();
        btn.classList.remove("off");
    }
}


/* ================= โหมดพิมพ์ A2 ================= */

const MM = 3.7795275591;                 // 1 มม. = px (96 dpi)
const SHEET_W = 594*MM, SHEET_H = 419*MM;

const CL_A = ["ด่านขุนทด","หนองบัวตะเกียด","หนองกราด","สีคิ้ว"];
const CL_B = ["บัวใหญ่","ปั๊มให้เช่า สีดา","ประทาย","ธารปราสาท"];

function ringBounds(it, km){
    km = km || RADIUS_M/1000;
    const dLat = km/111.32;
    const dLng = km/(111.32*Math.cos(it.lat*Math.PI/180));
    return L.latLngBounds([it.lat-dLat, it.lng-dLng],[it.lat+dLat, it.lng+dLng]);
}

function unionBounds(list, withRing){
    let b = null;
    list.forEach(it=>{
        const x = withRing ? ringBounds(it) : L.latLngBounds([it.lat,it.lng],[it.lat,it.lng]);
        b = b ? b.extend(x) : x;
    });
    return b;
}

function hav(a,b){
    const R=6371, r=Math.PI/180;
    const dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
    const h=Math.sin(dLat/2)**2 +
            Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));
}

// สีเฉพาะตอนพิมพ์ : จุดเป้าหมายแต่ละจุดใช้สีต่างกัน (สาขา KC ใช้สีเดิม)
const PCOL = {
    "ด่านขุนทด":"#1565c0",
    "หนองบัวตะเกียด":"#6d4c41",
    "หนองกราด":"#c2185b",
    "สีคิ้ว":"#f9a825",
    "ธารปราสาท":"#00838f",
    "ประทาย":"#455a64",
    "บัวใหญ่":"#827717",
    "ปั๊มให้เช่า สีดา":"#8e24aa"
};

const FIT_PAD = [60,60];

const SHEETS = [
    {
        title:"ภาพรวมพื้นที่เป้าหมาย และสาขา KC เดิม",
        sub:"ทุกจุด พร้อมวงรัศมี 80 กม.",
        main:i=>true,
        ring:i=>true,
        districts:false,
        go:(main)=>map.fitBounds(unionBounds(main,true),
                    {padding:[30,30], animate:false})
    },
    {
        title:"กลุ่ม A : ด่านขุนทด – หนองบัวตะเกียด – หนองกราด – สีคิ้ว (พร้อมสาขา ST, KN)",
        sub:"วงแต่ละจุดใช้สีต่างกัน • ระดับซูมเท่ากับกรอบกลุ่ม A • รัศมีสาขา ST/KN แสดงเฉพาะส่วนที่อยู่ในกรอบ",
        main:i=>CL_A.includes(i.name) || i.name==="ST" || i.name==="KN",
        ring:i=>CL_A.includes(i.name) || i.name==="ST" || i.name==="KN",
        districts:false,
        go:(main)=>{
            const A = main.filter(i=>CL_A.includes(i.name));
            // ระดับซูมของกรอบกลุ่ม A (เต็มวง) เป็นเพดาน
            const z0 = map.getBoundsZoom(unionBounds(A,true), false, L.point(60,60));
            // แล้วเลื่อนกรอบให้เห็นจุดของ ST, KN ด้วย โดยไม่ซูมออกเกินจำเป็น
            map.fitBounds(unionBounds(main,false),
                {padding:FIT_PAD, maxZoom:z0, animate:false});
        }
    },
    {
        title:"กลุ่ม B : บัวใหญ่ – สีดา – ประทาย – ธารปราสาท (พร้อมสาขา ST)",
        sub:"วงแต่ละจุดใช้สีต่างกัน • รัศมีสาขา ST แสดงเฉพาะส่วนที่อยู่ในกรอบ",
        main:i=>CL_B.includes(i.name) || i.name==="ST",
        ring:i=>CL_B.includes(i.name) || i.name==="ST",
        districts:false,
        go:(main)=>{
            const B = main.filter(i=>CL_B.includes(i.name));
            const st = main.filter(i=>i.name==="ST");
            const b = unionBounds(B,true).extend(unionBounds(st,false));
            map.fitBounds(b,{padding:[30,30], animate:false});
        }
    },
    {
        title:"การทับซ้อนกับสาขา KC เดิม (ระดับอำเภอ)",
        sub:"แสดงรัศมีสาขา ST, KN, MUK เฉพาะส่วนที่อยู่ในกรอบ • จุดเป้าหมายแสดงเป็นจุด • มีชื่ออำเภอกำกับ",
        main:i=>i.group==="target" || i.name==="ST" || i.name==="KN" || i.name==="MUK",
        ring:i=>i.group==="station",
        districts:true,
        go:(main)=>map.fitBounds(unionBounds(main,false),
                    {padding:[70,70], animate:false})
    }
];

let printMode = false;
let curSheet = 1;
let saved = null;

function labelText(it){
    if(it.group==="station") return "KC "+it.name;
    return it.no+". "+it.name;
}

function qrSvg(text){
    try{
        if(typeof qrcode === "undefined") return "";
        const q = qrcode(0,"M");
        q.addData(text);
        q.make();
        return q.createSvgTag({cellSize:2, margin:0, scalable:true});
    }catch(e){ return ""; }
}

function fitScreen(){
    const s = Math.min((window.innerWidth-24)/SHEET_W,
                       (window.innerHeight-56-20)/SHEET_H);
    const sc = Math.max(.2, Math.min(s,1));
    const sheet = document.getElementById("sheet");
    const stage = document.getElementById("stage");
    sheet.style.setProperty("--s", sc);
    stage.style.width  = (SHEET_W*sc)+"px";
    stage.style.height = (SHEET_H*sc)+"px";
}

function enterPrint(n){

    if(!printMode){

        saved = {
            showLabels, showRadiusAll,
            items: items.map(i=>({show:i.show, ring:i.ring}))
        };

        printMode = true;
        document.body.classList.add("print-mode");
        map.options.zoomSnap = 0.25;

        let st = document.getElementById("pageStyle");
        if(!st){
            st = document.createElement("style");
            st.id = "pageStyle";
            st.textContent = "@page{size:594mm 420mm;margin:0}";
            document.head.appendChild(st);
        }

        window.addEventListener("resize", fitScreen);
    }

    fitScreen();
    applySheet(n || 1);
}

function exitPrint(){

    if(!printMode) return;
    printMode = false;

    document.body.classList.remove("print-mode");
    window.removeEventListener("resize", fitScreen);

    const st = document.getElementById("pageStyle");
    if(st) st.remove();

    map.options.zoomSnap = 1;
    updateDistrictLabels(false);

    items.forEach((it,k)=>{
        it.show = saved.items[k].show;
        it.ring = saved.items[k].ring;
        it.marker.setRadius(it.r0);
        it.marker.setStyle({color:it.color, fillColor:it.color, fillOpacity:1});
        it.circle.setStyle({color:it.color, fillColor:it.color,
                            fillOpacity:it.fill0, weight:3});
        it.marker.setTooltipContent(it.label0);
        const tip = it.marker.getTooltip();
        tip.options.direction = "right";
        tip.options.offset = [10,0];
    });

    showLabels = saved.showLabels;
    showRadiusAll = saved.showRadiusAll;

    map.invalidateSize();
    refreshAll();
}

function applySheet(n){

    if(!printMode) return;

    curSheet = n;
    const S = SHEETS[n-1];

    document.querySelectorAll("#toolbar button[data-sheet]").forEach(b=>{
        b.classList.toggle("active", +b.dataset.sheet===n);
    });

    showLabels = true;
    showRadiusAll = true;

    // 1) เลือกจุดหลักของแผ่นนี้
    items.forEach(it=>{
        it.ctx = false;
        it.show = !!S.main(it);
        it.ring = it.show && !!S.ring(it);
        it.pcolor = PCOL[it.name] || it.color;
        it.marker.setRadius(it.r0*1.5);
        it.marker.setStyle({color:it.pcolor, fillColor:it.pcolor, fillOpacity:1});
        it.circle.setStyle({color:it.pcolor, fillColor:it.pcolor,
                            fillOpacity:.06, weight:2.5});
        it.marker.setTooltipContent(labelText(it));
    });

    const main = items.filter(i=>i.show);

    // 2) หัวกระดาษ
    document.getElementById("shTitle").textContent = S.title;
    document.getElementById("shSub").textContent = S.sub;
    document.getElementById("shRight").innerHTML =
        "แผ่นที่ "+n+" / "+SHEETS.length+"<br>" +
        "พิมพ์เมื่อ "+new Date().toLocaleDateString("th-TH",
            {day:"numeric",month:"long",year:"numeric"});

    // 3) สร้างส่วนท้ายก่อน (กินพื้นที่) แล้วค่อยซูมแผนที่ให้พอดีกรอบที่เหลือ
    buildFooter(main);
    map.invalidateSize({animate:false});
    refreshAll();
    S.go(main);

    // 4) จุดอื่นที่บังเอิญอยู่ในกรอบ แสดงเป็นจุดอ้างอิง (ไม่มีวง)
    const view = map.getBounds();
    items.forEach(it=>{
        if(!it.show && view.contains([it.lat,it.lng])){
            it.show = true;
            it.ring = false;
            it.ctx = true;
            it.marker.setStyle({fillOpacity:.45});
        }
    });
    refreshAll();
    updateDistrictLabels(S.districts);
    placeLabels();
}

// ชื่ออำเภอ (เฉพาะแผ่นที่ต้องการ) : วางที่กึ่งกลางอำเภอที่อยู่ในกรอบแผนที่
let ampLayer = null;

function updateDistrictLabels(on){

    if(ampLayer){ map.removeLayer(ampLayer); ampLayer = null; }
    if(!on || !geo.district) return;

    ampLayer = L.layerGroup();
    const view = map.getBounds();

    geo.district.eachLayer(l=>{
        const f = l.feature || {};
        const name = (f.properties||{}).amp_th;
        if(!name || !l.getBounds) return;
        const c = l.getBounds().getCenter();
        if(!view.contains(c)) return;
        L.marker(c,{
            interactive:false,
            keyboard:false,
            zIndexOffset:-1000,
            icon:L.divIcon({
                className:"amp-label",
                html:'<span class="amp-t">'+name+'</span>',
                iconSize:[0,0]
            })
        }).addTo(ampLayer);
    });

    ampLayer.addTo(map);
}

// จัดทิศของ label ไม่ให้ทับกัน (ไล่ทีละจุด เลือกทิศแรกที่ไม่ชน label/จุดอื่น)
function placeLabels(){

    const H = 30;
    const DIRS = ["right","left","top","bottom"];
    const shown = items.filter(i=>i.show);
    const pts = shown.map(i=>({it:i, p:map.latLngToContainerPoint([i.lat,i.lng])}));
    const placed = [];

    function rect(p, d, w){
        if(d==="right")  return {x1:p.x+11,   x2:p.x+11+w,  y1:p.y-H/2,   y2:p.y+H/2};
        if(d==="left")   return {x1:p.x-11-w, x2:p.x-11,    y1:p.y-H/2,   y2:p.y+H/2};
        if(d==="top")    return {x1:p.x-w/2,  x2:p.x+w/2,   y1:p.y-13-H,  y2:p.y-13};
        return                  {x1:p.x-w/2,  x2:p.x+w/2,   y1:p.y+13,    y2:p.y+13+H};
    }

    function hit(a,b){
        return a.x1<b.x2 && a.x2>b.x1 && a.y1<b.y2 && a.y2>b.y1;
    }

    // จุดของทุกหมุดถือเป็นสิ่งกีดขวางเล็กๆ
    const dots = pts.map(q=>({x1:q.p.x-11,x2:q.p.x+11,y1:q.p.y-11,y2:q.p.y+11}));

    pts.forEach((q,k)=>{

        const w = labelText(q.it).length*11 + 22;
        let best = null;

        for(const d of DIRS){
            const r = rect(q.p,d,w);
            const clash = placed.some(o=>hit(r,o)) ||
                          dots.some((o,j)=>j!==k && hit(r,o));
            if(!clash){ best = {d,r}; break; }
        }

        if(!best) best = {d:"right", r:rect(q.p,"right",w)};
        placed.push(best.r);

        const tip = q.it.marker.getTooltip();
        tip.options.direction = best.d;
        tip.options.offset = {
            right:[11,0], left:[-11,0], top:[0,-11], bottom:[0,11]
        }[best.d];
        q.it.marker.closeTooltip();
        q.it.marker.openTooltip();
    });
}

function buildFooter(main){

    const stationsOnly = items.filter(i=>i.group==="station");
    const grid = document.getElementById("footGrid");
    grid.innerHTML = "";

    main.forEach(it=>{

        let nearTxt = "";

        if(it.group==="target"){
            let best = null;
            stationsOnly.forEach(s=>{
                const d = hav(it,s);
                if(!best || d<best.d) best = {d, s};
            });
            const inside = best.d <= RADIUS_M/1000;
            nearTxt = "ห่างสาขา KC "+best.s.name+" ~"+Math.round(best.d)+" กม." +
                (inside ? ' <span class="warn">(อยู่ในวงสาขา)</span>' : "");
        }else{
            nearTxt = "สาขาเดิม";
        }

        const url = "https://www.google.com/maps?q="+it.lat+","+it.lng;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML =
            '<div class="qr">'+qrSvg(url)+'</div>' +
            '<div>' +
                '<div class="nm"><span class="no" style="background:'+(it.pcolor||it.color)+'">' +
                    (it.group==="station" ? "KC" : it.no) +
                '</span>' + it.name + '</div>' +
                '<div class="mut">'+it.lat.toFixed(5)+', '+it.lng.toFixed(5)+'</div>' +
                '<div>'+nearTxt+'</div>' +
            '</div>';

        grid.appendChild(card);
    });

    document.getElementById("footNote").innerHTML =
        "<span>วงรัศมี 80 กม. วัดเป็นเส้นตรง ไม่ใช่ระยะทางถนน &nbsp;|&nbsp; " +
        "สแกน QR เพื่อเปิดพิกัดใน Google Maps &nbsp;|&nbsp; " +
        "จุดสีจางคือจุดอ้างอิงที่อยู่ในกรอบแผนที่</span>" +
        "<span>แผนที่พื้นฐาน &copy; OpenStreetMap contributors</span>";
}

function doPrint(){

    if(!printMode) return;

    // ตัด transform ตอนพิมพ์ แล้วให้แผนที่คำนวณขนาด/ซูมใหม่ ก่อนสั่งพิมพ์
    applySheet(curSheet);

    let done = false;
    const go = ()=>{
        if(done) return;
        done = true;
        window.print();
    };

    // รอให้ tile โหลดครบก่อน (สำรอง 5 วินาที)
    tiles.once("load", ()=>setTimeout(go, 400));
    setTimeout(go, 3000);
    map.invalidateSize({animate:false});
    map.setView(map.getCenter(), map.getZoom(), {animate:false});
}

window.addEventListener("beforeprint", ()=>{
    if(printMode){
        map.invalidateSize({animate:false});
        applySheet(curSheet);
    }
});
