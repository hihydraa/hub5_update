<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KC Location Analysis Leaflet</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html,body,#map{
    height:100%;
    margin:0;
}

#map{
    width:100%;
}

#dashboard{
    position:absolute;
    z-index:999;
    top:10px;
    left:10px;
    width:300px;
    max-height:calc(100% - 40px);
    overflow-y:auto;
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 0 10px #888;
    font-family:Arial, "Noto Sans Thai", sans-serif;
    font-size:14px;
}

#dashboard hr{
    border:0;
    border-top:1px solid #ddd;
    margin:10px 0;
}

button{
    width:100%;
    padding:8px;
    margin:4px 0;
    border:0;
    border-radius:5px;
    background:#1565c0;
    color:white;
    cursor:pointer;
}

button.off{
    background:#9e9e9e;
}

.row2{
    display:flex;
    gap:6px;
}

.row2 button{
    margin:4px 0;
}

.group-title{
    font-weight:bold;
    margin:6px 0 4px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.group-title span.mini{
    font-weight:normal;
    font-size:12px;
}

.group-title a{
    color:#1565c0;
    cursor:pointer;
    text-decoration:underline;
    margin-left:6px;
}

.pt{
    display:flex;
    align-items:center;
    gap:6px;
    padding:3px 0;
}

.pt label{
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
    flex:1;
}

.pt .dot{
    width:11px;
    height:11px;
    border-radius:50%;
    display:inline-block;
    flex:none;
}

.pt .ring{
    font-size:12px;
    color:#555;
    display:flex;
    align-items:center;
    gap:3px;
    cursor:pointer;
}

.pt-label{
    background:rgba(255,255,255,.92);
    border:1px solid #888;
    border-radius:4px;
    padding:1px 5px;
    font-family:Arial, "Noto Sans Thai", sans-serif;
    font-size:12px;
    font-weight:bold;
    box-shadow:none;
}

.land-label{
    background:#fff59d;
    border:1px solid #8d6e00;
    border-radius:4px;
    padding:1px 5px;
    font-family:Arial, "Noto Sans Thai", sans-serif;
    font-size:12px;
    font-weight:bold;
    color:#5d4300;
    box-shadow:none;
}

.land-pop td{
    padding:1px 4px;
    vertical-align:top;
}

.leaflet-popup-content{
    margin:12px 14px;
}

.lp-head{
    font-size:14px;
    margin-bottom:4px;
}

.lp-gm{
    display:inline-block;
    margin:6px 0 8px;
    padding:6px 10px;
    background:#1a73e8;
    color:#fff !important;
    border-radius:5px;
    text-decoration:none;
    font-weight:bold;
    font-size:13px;
}

.lp-tabs{
    display:flex;
    gap:4px;
    border-bottom:2px solid #f9a825;
    margin-bottom:6px;
}

.lp-tab{
    flex:1;
    width:auto;
    margin:0;
    padding:6px 4px;
    font-size:12px;
    background:#eee;
    color:#333;
    border-radius:5px 5px 0 0;
}

.lp-tab.on{
    background:#f9a825;
    color:#000;
    font-weight:bold;
}

.lp-pane{
    display:none;
}

.lp-pane.on{
    display:block;
}

.lp-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:4px;
}

.lp-grid.one{
    grid-template-columns:1fr;
}

.lp-thumb{
    display:block;
    width:100%;
    aspect-ratio:4/3;
    object-fit:cover;
    border-radius:4px;
    cursor:zoom-in;
    background:#eee;
    border:1px solid #ccc;
    box-sizing:border-box;
}

.lp-grid.one .lp-thumb{
    aspect-ratio:1.7;
    object-fit:cover;
    object-position:center top;
}

.lp-none{
    font-size:12px;
    color:#888;
    padding:8px 0;
}

/* ---------- ดูภาพเต็มจอ ---------- */

#lightbox{
    display:none;
    position:fixed;
    inset:0;
    z-index:5000;
    background:rgba(0,0,0,.92);
    color:#fff;
    font-family:Arial, "Noto Sans Thai", sans-serif;
}

#lightbox.on{
    display:flex;
    flex-direction:column;
}

#lbBar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 12px;
    font-size:14px;
}

#lbBar .sp{
    flex:1;
}

#lbBar a{
    color:#90caf9;
}

#lightbox button{
    width:auto;
    margin:0;
    background:rgba(255,255,255,.15);
    font-size:20px;
    padding:6px 14px;
}

#lbWrap{
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:0 8px 12px;
}

#lbImg{
    max-width:calc(100% - 120px);
    max-height:100%;
    object-fit:contain;
    background:#222;
}

.land-msg{
    font-size:12px;
    color:#777;
    margin-top:2px;
}

#info{
    font-size:12px;
    color:#555;
    margin-top:6px;
}

.tp-input{
    flex:1;
    min-width:0;
    padding:6px 7px;
    margin:4px 0;
    border:1px solid #bbb;
    border-radius:5px;
    font-size:13px;
    box-sizing:border-box;
}

.tp-msg{
    font-size:12px;
    min-height:15px;
    margin-top:2px;
}

.tp-msg.err{
    color:#c62828;
}

.tp-msg.ok{
    color:#2e7d32;
}

.temp-pin-label{
    background:#e65100;
    color:#fff;
    border:1px solid #bf360c;
    border-radius:4px;
    padding:1px 6px;
    font-family:Arial, "Noto Sans Thai", sans-serif;
    font-size:12px;
    font-weight:bold;
    box-shadow:none;
}

/* ================= โครงหน้า (ปกติ = เต็มจอ) ================= */

#stage,#sheet{
    height:100%;
}

#sheet{
    display:flex;
    flex-direction:column;
    background:#fff;
}

#sheet #map{
    flex:1;
    height:auto;
    min-height:0;
}

#sheetHead,#sheetFoot,#toolbar,#northArrow{
    display:none;
}

/* ================= โหมดพิมพ์ A2 (594 x 420 มม. แนวนอน) ================= */

body.print-mode{
    background:#5f6368;
    overflow:auto;
    font-family:Arial, "Noto Sans Thai", sans-serif;
}

body.print-mode #dashboard{
    display:none;
}

body.print-mode #toolbar{
    display:flex;
    position:fixed;
    top:0; left:0; right:0;
    height:44px;
    z-index:3000;
    background:#202124;
    color:#fff;
    align-items:center;
    gap:8px;
    padding:0 12px;
    font-size:14px;
}

body.print-mode #toolbar button{
    width:auto;
    margin:0;
    padding:7px 12px;
    background:#3c4043;
}

body.print-mode #toolbar button.active{
    background:#1565c0;
}

body.print-mode #toolbar button.go{
    background:#2e7d32;
    margin-left:auto;
}

body.print-mode #stage{
    position:relative;
    height:auto;
    margin:56px 300px 20px 12px;
}

#printPanel{
    display:none;
}

body.print-mode #printPanel{
    display:block;
    position:fixed;
    top:52px;
    right:8px;
    bottom:8px;
    width:280px;
    overflow-y:auto;
    z-index:3000;
    background:#fff;
    border-radius:8px;
    padding:10px 12px;
    box-sizing:border-box;
    font-family:Arial, "Noto Sans Thai", sans-serif;
    font-size:13px;
    box-shadow:0 0 10px #000;
}

#printPanel hr{
    border:0;
    border-top:1px solid #ddd;
    margin:8px 0;
}

#printPanel .pp-sec{
    font-weight:bold;
    margin:6px 0 2px;
}

#printPanel .pp-links a{
    color:#1565c0;
    cursor:pointer;
    text-decoration:underline;
    margin-right:8px;
    font-size:12px;
}

#printPanel .pp-note{
    font-size:11px;
    color:#777;
}

#printPanel button{
    margin:6px 0 0;
    padding:6px;
    font-size:12px;
}

body.print-mode .land-label{
    font-size:5mm;
    padding:.4mm 1.6mm;
    border:.3mm solid #8d6e00;
}

body.print-mode #sheet{
    position:absolute;
    top:0; left:0;
    width:594mm;
    height:419mm;
    overflow:hidden;
    transform-origin:0 0;
    transform:scale(var(--s,1));
    box-shadow:0 0 12px #000;
    box-sizing:border-box;
    padding:9mm 10mm 9mm;
}

body.print-mode #sheetHead{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    padding-bottom:3mm;
    border-bottom:.6mm solid #222;
    margin-bottom:3mm;
}

body.print-mode #sheetHead h1{
    margin:0;
    font-size:9mm;
    line-height:1.1;
}

body.print-mode #sheetHead .sub{
    font-size:4mm;
    color:#444;
    margin-top:1.5mm;
}

body.print-mode #sheetHead .right{
    text-align:right;
    font-size:4mm;
    color:#333;
    line-height:1.5;
}

body.print-mode #sheet #map{
    border:.4mm solid #222;
    position:relative;
}

body.print-mode #sheetFoot{
    display:block;
    margin-top:3mm;
}

.foot-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:2mm;
}

.card{
    display:flex;
    gap:2mm;
    border:.3mm solid #999;
    border-radius:1mm;
    padding:1.5mm;
    font-size:3.3mm;
    line-height:1.3;
    align-items:flex-start;
}

.card .qr{
    width:17mm;
    height:17mm;
    flex:none;
}

.card .qr svg{
    width:100%;
    height:100%;
    display:block;
}

.card .no{
    display:inline-block;
    min-width:5mm;
    text-align:center;
    color:#fff;
    border-radius:1mm;
    padding:0 1mm;
    font-weight:bold;
    margin-right:1mm;
}

.card .nm{
    font-weight:bold;
    font-size:3.8mm;
}

.card .mut{
    color:#555;
}

.card .warn{
    color:#b71c1c;
    font-weight:bold;
}

.foot-note{
    margin-top:2mm;
    font-size:3.2mm;
    color:#555;
    display:flex;
    justify-content:space-between;
}

body.print-mode .pt-label{
    font-size:5mm;
    padding:.4mm 1.6mm;
    border:.3mm solid #444;
}

.amp-label{
    background:none;
    border:0;
}

.amp-t{
    position:absolute;
    transform:translate(-50%,-50%);
    white-space:nowrap;
    font-family:Arial, "Noto Sans Thai", sans-serif;
    font-size:3.8mm;
    font-weight:600;
    color:#37474f;
    text-shadow:0 0 1.2mm #fff, 0 0 1.2mm #fff, 0 0 1.2mm #fff;
}

body.print-mode .leaflet-control-zoom{
    display:none;
}

body.print-mode .leaflet-control-scale-line{
    font-size:4mm;
    border-width:.6mm;
    background:rgba(255,255,255,.9);
}

body.print-mode #northArrow{
    display:block;
    position:absolute;
    top:5mm;
    right:5mm;
    z-index:1000;
    width:16mm;
    background:rgba(255,255,255,.9);
    border:.3mm solid #444;
    border-radius:1mm;
    text-align:center;
    font-weight:bold;
    font-size:5mm;
    line-height:1;
    padding:1mm 0;
}

@media print{

    html,body{
        height:auto !important;
        overflow:visible !important;
    }

    body.print-mode{
        background:#fff;
    }

    body.print-mode #toolbar,
    body.print-mode #printPanel{
        display:none !important;
    }

    body.print-mode #stage{
        margin:0 !important;
        width:594mm !important;
        height:419mm !important;
    }

    body.print-mode #sheet{
        transform:none !important;
        box-shadow:none;
    }

    body.print-mode *{
        -webkit-print-color-adjust:exact;
        print-color-adjust:exact;
    }
}
</style>

</head>

<script>

const map = L.map('map').setView([15.8,102.8],8);

const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,
    attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);


/* ---------- ข้อมูลจุด ---------- */

const targets=[
    ["ด่านขุนทด",15.229674,101.779315],
    ["หนองบัวตะเกียด",15.293108657176782,101.81087126460163],
    ["หนองกราด",15.35786365252799,101.68660911066699],
    ["ธารปราสาท",15.222493202715457,102.36249218396031],
    ["สีคิ้ว",14.918396902178808,101.69588802390821],
    ["ประทาย",15.548779864748118,102.70333262449823],
    ["บัวใหญ่",15.611245466671665,102.44792294125068],
    ["ปั๊มให้เช่า สีดา",15.525777647736012,102.54328018222795]
];

const stations=[
    ["ST",16.381029272179042,103.34881852164082,"red"],
    ["KN",16.71600409911031,103.08205194412724,"green"],
    ["MUK",16.43599207530131,104.61612804232725,"purple"],
    ["WNN",17.6293190999291,103.7676571040772,"orange"]
];

const RADIUS_M = 80000;
const TARGET_COLOR = "#0066ff";


/* ---------- สถานะ ---------- */

// แต่ละจุดมี marker + วงรัศมี และสถานะเปิด/ปิดเป็นของตัวเอง
const items = [];              // {id, group, name, color, marker, circle, show, ring}
let showLabels = true;
let showRadiusAll = true;

const geo = {province:null, district:null};


/* ---------- สร้างจุดทั้งหมด ---------- */

function makeItem(group, name, lat, lng, color, radiusPx){

    const marker = L.circleMarker([lat,lng],{
        radius:radiusPx,
        color:color,
        fillColor:color,
        fillOpacity:1
    });

    marker.bindPopup(
        (group==="station" ? "KC " : "พื้นที่เป้าหมาย : ") + name
        + "<br><small>" + lat.toFixed(5) + ", " + lng.toFixed(5) + "</small>"
    );

    // label ติดกับจุด (ไม่ต้องคลิก)
    marker.bindTooltip(
        group==="station" ? "KC "+name : name,
        {permanent:true, direction:"right", offset:[10,0], className:"pt-label"}
    );

    const circle = L.circle([lat,lng],{
        radius:RADIUS_M,
        color:color,
        fillColor:color,
        fillOpacity: group==="station" ? .12 : .15,
        interactive:false
    });

    const it = {
        id: items.length,
        group, name, color, marker, circle,
        lat, lng,
        r0: radiusPx,
        fill0: group==="station" ? .12 : .15,
        label0: group==="station" ? "KC "+name : name,
        no: null,
        show:true,
        ring:true
    };

    items.push(it);
    return it;
}

targets.forEach(t=>makeItem("target", t[0], t[1], t[2], TARGET_COLOR, 7));
stations.forEach(s=>makeItem("station", s[0], s[1], s[2], s[3], 9));

// เลขลำดับของจุดเป้าหมาย (ใช้อ้างอิงตรงกันทุกแผ่นพิมพ์)
items.filter(i=>i.group==="target").forEach((i,n)=>i.no=n+1);

L.control.scale({imperial:false, maxWidth:300, position:"bottomleft"}).addTo(map);


/* ---------- วาดตามสถานะ ---------- */

function refreshItem(it){

    // จุด + label
    if(it.show){
        if(!map.hasLayer(it.marker)) it.marker.addTo(map);
    }else{
        if(map.hasLayer(it.marker)) map.removeLayer(it.marker);
    }

    // วงรัศมี : ต้องเปิดจุด + เปิดวงรายจุด + เปิดวงรวม
    const wantRing = it.show && it.ring && showRadiusAll;
    if(wantRing){
        if(!map.hasLayer(it.circle)) it.circle.addTo(map);
    }else{
        if(map.hasLayer(it.circle)) map.removeLayer(it.circle);
    }

    // label
    if(it.show){
        if(showLabels) it.marker.openTooltip();
        else it.marker.closeTooltip();
    }
}

function refreshAll(){
    items.forEach(refreshItem);
    syncControls();
    updateInfo();
}


/* ---------- รายการ checkbox รายจุด ---------- */

function buildList(group, elId){

    const box = document.getElementById(elId);
    box.innerHTML = "";

    items.filter(i=>i.group===group && !i.dead).forEach(it=>{

        const row = document.createElement("div");
        row.className = "pt";

        row.innerHTML =
            '<label>' +
                '<input type="checkbox" data-role="show" data-id="'+it.id+'">' +
                '<span class="dot" style="background:'+it.color+'"></span>' +
                '<span>'+it.label0+'</span>' +
            '</label>' +
            '<label class="ring" title="เปิด/ปิด วงรัศมี 80 กม. ของจุดนี้">' +
                '<input type="checkbox" data-role="ring" data-id="'+it.id+'">วง' +
            '</label>';

        box.appendChild(row);
    });
}

document.getElementById("dashboard").addEventListener("change",e=>{

    const role = e.target.dataset.role;
    if(!role) return;

    const it = items[+e.target.dataset.id];

    if(role==="show") it.show = e.target.checked;
    if(role==="ring") it.ring = e.target.checked;

    refreshAll();
});

// อัปเดต checkbox ให้ตรงกับสถานะจริง (เช่น หลังกดปุ่ม scenario)
function syncControls(){

    document.querySelectorAll("input[data-role]").forEach(cb=>{
        const it = items[+cb.dataset.id];
        cb.checked = cb.dataset.role==="show" ? it.show : it.ring;
        if(cb.dataset.role==="ring") cb.disabled = !it.show;
    });

    setBtn("btnLabel", showLabels, "Label");
    setBtn("btnRadius", showRadiusAll, "วงรัศมี 80 กม.");
}

function setBtn(id, on, text){
    const b = document.getElementById(id);
    b.textContent = text + " : " + (on ? "เปิด" : "ปิด");
    b.classList.toggle("off", !on);
}

function updateInfo(){
    const live = items.filter(i=>!i.dead);
    const on = live.filter(i=>i.show).length;
    document.getElementById("info").innerHTML =
        "แสดงอยู่ " + on + " / " + live.length + " จุด";
}


/* ---------- ปุ่มควบคุม ---------- */

function toggleLabels(){
    showLabels = !showLabels;
    refreshAll();
}

function toggleAllRadius(){
    showRadiusAll = !showRadiusAll;
    refreshAll();
}

function setGroup(group, on){
    items.filter(i=>i.group===group && !i.dead).forEach(i=>i.show=on);
    refreshAll();
}

function showScenario(type){

    items.forEach(i=>{
        if(i.dead) return;
        i.ring = true;
        if(type==="all")    i.show = true;
        if(type==="kc")     i.show = i.group==="station";
        if(type==="target") i.show = i.group==="target";
    });

    showRadiusAll = true;
    refreshAll();

    const msg = {
        all:"แสดงทั้งหมด",
        kc:"KC Existing : ST KN MUK WNN",
        target:"พื้นที่เป้าหมาย Radius 80 km"
    }[type];

    document.getElementById("info").innerHTML = msg;
}


/* ---------- GeoJSON ---------- */

function loadGeo(key, url, btnId, styleObj, labelPrefix, propKeys){

    fetch(url)
    .then(r=>{
        if(!r.ok) throw new Error(r.status);
        return r.json();
    })
    .then(data=>{

        if(!data.features || !data.features.length)
            throw new Error("ไฟล์ว่าง");

        geo[key] = L.geoJSON(data,{
            style:styleObj,
            onEachFeature:(f,l)=>{
                const p = f.properties || {};
                let name = "ไม่พบชื่อ";
                for(const k of propKeys){
                    if(p[k]){ name = p[k]; break; }
                }
                l.bindPopup(labelPrefix + " : " + name);
            }
        });

        // ให้ชั้นแผนที่อยู่ใต้จุดเสมอ
        geo[key].addTo(map);
        geo[key].bringToBack();
        document.getElementById(btnId).classList.remove("off");
    })
    .catch(err=>{
        console.warn("โหลด "+url+" ไม่สำเร็จ:", err);
        const b = document.getElementById(btnId);
        b.disabled = true;
        b.style.opacity = .5;
        b.title = "โหลดไฟล์ไม่สำเร็จ / ไฟล์ว่าง";
        b.textContent += " (ไม่มีข้อมูล)";
    });
}

function toggleGeo(type){

    const g = geo[type];
    if(!g) return;

    const btn = document.getElementById(type==="province" ? "btnProvince" : "btnDistrict");

    if(map.hasLayer(g)){
        map.removeLayer(g);
        btn.classList.add("off");
    }else{
        g.addTo(map);
        g.bringToBack();
        btn.classList.remove("off");
    }
}


/* ================= โหมดพิมพ์ A2 ================= */

const MM = 3.7795275591;                 // 1 มม. = px (96 dpi)
const SHEET_W = 594*MM, SHEET_H = 419*MM;

const CL_A = ["ด่านขุนทด","หนองบัวตะเกียด","หนองกราด","สีคิ้ว"];
const CL_B = ["บัวใหญ่","ปั๊มให้เช่า สีดา","ประทาย","ธารปราสาท"];

function ringBounds(it, km){
    km = km || RADIUS_M/1000;
    const dLat = km/111.32;
    const dLng = km/(111.32*Math.cos(it.lat*Math.PI/180));
    return L.latLngBounds([it.lat-dLat, it.lng-dLng],[it.lat+dLat, it.lng+dLng]);
}

function unionBounds(list, withRing){
    let b = null;
    if(!list || !list.length) return null;
    list.forEach(it=>{
        const x = withRing ? ringBounds(it) : L.latLngBounds([it.lat,it.lng],[it.lat,it.lng]);
        b = b ? b.extend(x) : x;
    });
    return b;
}

function hav(a,b){
    const R=6371, r=Math.PI/180;
    const dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
    const h=Math.sin(dLat/2)**2 +
            Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));
}

// สีเฉพาะตอนพิมพ์ : จุดเป้าหมายแต่ละจุดใช้สีต่างกัน (สาขา KC ใช้สีเดิม)

        sub:"วงแต่ละจุดใช้สีต่างกัน • ระดับซูมเท่ากับกรอบกลุ่ม A • รัศมีสาขา ST/KN แสดงเฉพาะส่วนที่อยู่ในกรอบ",

// สถานะเปิด/ปิดหมุดและวง แยกตามแผ่น (จำไว้จนกว่าจะรีเฟรชหน้า)
const PS = {};
function sheetState(n){
    return PS[n] || (PS[n] = {show:new Map(), ring:new Map()});
}
let autoFit = true;

let printMode = false;
let curSheet = 1;
let saved = null;

function labelText(it){
    if(it.group==="station") return "KC "+it.name;
    if(it.group==="land") return "ขาย "+it.no+". "+it.name;
    return it.no+". "+it.name;
}

function qrSvg(text){
    try{
        if(typeof qrcode === "undefined") return "";
        const q = qrcode(0,"M");
        q.addData(text);
        q.make();
        return q.createSvgTag({cellSize:2, margin:0, scalable:true});
    }catch(e){ return ""; }
}

function fitScreen(){
    const s = Math.min((window.innerWidth-24-300)/SHEET_W,
                       (window.innerHeight-56-20)/SHEET_H);
    const sc = Math.max(.2, Math.min(s,1));
    const sheet = document.getElementById("sheet");
    const stage = document.getElementById("stage");
    sheet.style.setProperty("--s", sc);
    stage.style.width  = (SHEET_W*sc)+"px";
    stage.style.height = (SHEET_H*sc)+"px";
}

function enterPrint(n){

    if(!printMode){

        saved = {
            showLabels, showRadiusAll,
            items: items.map(i=>({show:i.show, ring:i.ring}))
        };

        printMode = true;
        document.body.classList.add("print-mode");
        map.options.zoomSnap = 0.25;

        let st = document.getElementById("pageStyle");
        if(!st){
            st = document.createElement("style");
            st.id = "pageStyle";
            st.textContent = "@page{size:594mm 420mm;margin:0}";
            document.head.appendChild(st);
        }

        window.addEventListener("resize", fitScreen);
    }

    fitScreen();
    applySheet(n || 1);
}

function exitPrint(){

    if(!printMode) return;
    printMode = false;

    document.body.classList.remove("print-mode");
    window.removeEventListener("resize", fitScreen);

    const st = document.getElementById("pageStyle");
    if(st) st.remove();

    map.options.zoomSnap = 1;
    updateDistrictLabels(false);

    items.forEach((it,k)=>{
        it.show = saved.items[k].show;
        it.ring = saved.items[k].ring;
        it.marker.setRadius(it.r0);
        it.marker.setStyle({color:it.border||it.color, fillColor:it.color, fillOpacity:1});
        it.circle.setStyle({color:it.color, fillColor:it.color,
                            fillOpacity:it.fill0, weight:it.weight0||3});
        it.marker.setTooltipContent(it.label0);
        const tip = it.marker.getTooltip();
        tip.options.direction = "right";
        tip.options.offset = [10,0];
    });

    showLabels = saved.showLabels;
    showRadiusAll = saved.showRadiusAll;

    map.invalidateSize();
    refreshAll();
}

function applySheet(n, keepView){

    if(!printMode) return;

    curSheet = n;
    const S = SHEETS[n-1];
    const st = sheetState(n);

    document.querySelectorAll("#toolbar button[data-sheet]").forEach(b=>{
        b.classList.toggle("active", +b.dataset.sheet===n);
    });

    showLabels = true;
    showRadiusAll = true;

    // 1) จุดหลักของแผ่นนี้ (ผู้ใช้เปิด/ปิดหมุดและวงได้จากแผงด้านขวา)
    items.forEach(it=>{

        it.ctx = false;
        it.cand = false;
        if(it.dead){ it.show = false; it.ring = false; return; }

        const isLand = it.group==="land";
        const cand = isLand ? !!(S.land && S.main(it)) : !S.land && !!S.main(it);

        it.cand = cand;
        it.ringDef = cand && !!S.ring(it);
        it.show = cand && (st.show.has(it.id) ? st.show.get(it.id) : true);
        it.ring = it.show && (st.ring.has(it.id) ? st.ring.get(it.id) : it.ringDef);

        it.pcolor = isLand ? LAND_COLOR : (PCOL[it.name] || it.color);
        it.marker.setRadius(it.r0*1.5);
        it.marker.setStyle({color:it.border||it.pcolor, fillColor:it.pcolor, fillOpacity:1});
        it.circle.setStyle({color:isLand ? "#f9a825" : it.pcolor, fillColor:it.pcolor,
                            fillOpacity:isLand ? .05 : .06, weight:isLand ? 3 : 2.5});
        it.marker.setTooltipContent(labelText(it));
    });

    const main = items.filter(i=>i.show);

    // 2) หัวกระดาษ
    document.getElementById("shTitle").textContent = S.title;
    document.getElementById("shSub").textContent = S.sub;
    document.getElementById("shRight").innerHTML =
        "แผ่นที่ "+n+" / "+SHEETS.length+"<br>" +
        "พิมพ์เมื่อ "+new Date().toLocaleDateString("th-TH",
            {day:"numeric",month:"long",year:"numeric"});

    // 3) สร้างส่วนท้ายก่อน (กินพื้นที่) แล้วค่อยซูมแผนที่ให้พอดีกรอบที่เหลือ
    buildFooter(main);
    map.invalidateSize({animate:false});
    refreshAll();
    if(!keepView && main.length){
        try{ S.go(main); }catch(err){ console.warn("จัดกรอบไม่สำเร็จ", err); }
    }

    // 4) จุดอื่นที่อยู่ในกรอบ = จุดอ้างอิงสีจาง (ไม่มีวง) ปิดทีละจุดได้
    const view = map.getBounds();
    items.forEach(it=>{
        if(it.dead || it.cand || it.group==="land") return;
        if(!view.contains([it.lat,it.lng])) return;
        it.ctx = true;
        it.show = st.show.has(it.id) ? st.show.get(it.id) : true;
        it.ring = false;
        it.marker.setStyle({fillOpacity:.45});
    });
    refreshAll();
    updateDistrictLabels(S.districts);
    placeLabels();
    buildPrintPanel();
}

// แผงเลือกหมุด (แสดงเฉพาะบนจอ ไม่ถูกพิมพ์)
function buildPrintPanel(){

    const S = SHEETS[curSheet-1];
    const box = document.getElementById("printPanel");
    const cand = items.filter(i=>i.cand);
    const ctx  = items.filter(i=>i.ctx);

    const row = (it, withRing)=>
        '<div class="pt">' +
            '<label><input type="checkbox" data-p="show" data-id="'+it.id+'"'+(it.show?" checked":"")+'>' +
            '<span class="dot" style="background:'+(it.pcolor||it.color)+(it.border?';border:1px solid '+it.border:'')+'"></span>' +
            '<span>'+labelText(it)+'</span></label>' +
            (withRing ? '<label class="ring"><input type="checkbox" data-p="ring" data-id="'+it.id+'"'+
                (it.ring?" checked":"")+(it.show?"":" disabled")+'>วง</label>' : '') +
        '</div>';

    box.innerHTML =
        '<b>แผ่นที่ '+curSheet+' : เลือกหมุด</b>' +
        '<div class="pp-note">'+S.title+'</div>' +
        '<hr>' +
        '<div class="pp-sec">จุดหลัก ('+cand.filter(i=>i.show).length+'/'+cand.length+')</div>' +
        '<div class="pp-links"><a data-pa="on">เปิดทั้งหมด</a><a data-pa="off">ปิดทั้งหมด</a></div>' +
        (cand.map(it=>row(it,true)).join("") || '<div class="pp-note">ไม่มีจุด</div>') +
        (ctx.length ?
            '<hr><div class="pp-sec">จุดอ้างอิงในกรอบ (สีจาง)</div>' +
            '<div class="pp-links"><a data-pa="ctxon">เปิดทั้งหมด</a><a data-pa="ctxoff">ปิดทั้งหมด</a></div>' +
            ctx.map(it=>row(it,false)).join("") : '') +
        '<hr>' +
        '<label class="pt"><input type="checkbox" id="ppAutoFit"'+(autoFit?" checked":"")+'>' +
            '<span>จัดกรอบแผนที่ใหม่ทุกครั้งที่เปิด/ปิดหมุด</span></label>' +
        '<button data-pa="fit">จัดกรอบให้พอดีจุดที่เปิดอยู่</button>' +
        '<button data-pa="reset" style="background:#757575">คืนค่าเริ่มต้นของแผ่นนี้</button>' +
        '<div class="pp-note" style="margin-top:6px">ตัวเลือกในแผงนี้ไม่ถูกพิมพ์ • จำค่าแยกตามแผ่นจนกว่าจะรีเฟรชหน้า</div>';
}

document.getElementById("printPanel").addEventListener("change", e=>{

    if(e.target.id==="ppAutoFit"){ autoFit = e.target.checked; return; }

    const p = e.target.dataset.p;
    if(!p) return;
    const st = sheetState(curSheet);
    const id = +e.target.dataset.id;

    if(p==="show") st.show.set(id, e.target.checked);
    if(p==="ring") st.ring.set(id, e.target.checked);

    // ปิดจุดอ้างอิงไม่ต้องจัดกรอบใหม่ (กรอบไม่ได้คิดจากจุดอ้างอิง)
    const isCtx = items[id] && items[id].ctx;
    applySheet(curSheet, !autoFit || isCtx);
});

document.getElementById("printPanel").addEventListener("click", e=>{

    const a = e.target.closest("[data-pa]");
    if(!a) return;
    const st = sheetState(curSheet);
    const act = a.dataset.pa;

    if(act==="on" || act==="off")
        items.filter(i=>i.cand).forEach(i=>st.show.set(i.id, act==="on"));
    if(act==="ctxon" || act==="ctxoff"){
        items.filter(i=>i.ctx).forEach(i=>st.show.set(i.id, act==="ctxon"));
        applySheet(curSheet, true);
        return;
    }
    if(act==="reset"){ PS[curSheet] = null; delete PS[curSheet]; }

    applySheet(curSheet, act==="fit" ? false : !autoFit);
});

// ชื่ออำเภอ (เฉพาะแผ่นที่ต้องการ) : วางที่กึ่งกลางอำเภอที่อยู่ในกรอบแผนที่
let ampLayer = null;

function updateDistrictLabels(on){

    if(ampLayer){ map.removeLayer(ampLayer); ampLayer = null; }
    if(!on || !geo.district) return;

    ampLayer = L.layerGroup();
    const view = map.getBounds();

    geo.district.eachLayer(l=>{
        const f = l.feature || {};
        const name = (f.properties||{}).amp_th;
        if(!name || !l.getBounds) return;
        const c = l.getBounds().getCenter();
        if(!view.contains(c)) return;
        L.marker(c,{
            interactive:false,
            keyboard:false,
            zIndexOffset:-1000,
            icon:L.divIcon({
                className:"amp-label",
                html:'<span class="amp-t">'+name+'</span>',
                iconSize:[0,0]
            })
        }).addTo(ampLayer);
    });

    ampLayer.addTo(map);
}

// จัดทิศของ label ไม่ให้ทับกัน (ไล่ทีละจุด เลือกทิศแรกที่ไม่ชน label/จุดอื่น)
function placeLabels(){

    const H = 30;
    const DIRS = ["right","left","top","bottom"];
    const shown = items.filter(i=>i.show);
    const pts = shown.map(i=>({it:i, p:map.latLngToContainerPoint([i.lat,i.lng])}));
    const placed = [];

    function rect(p, d, w){
        if(d==="right")  return {x1:p.x+11,   x2:p.x+11+w,  y1:p.y-H/2,   y2:p.y+H/2};
        if(d==="left")   return {x1:p.x-11-w, x2:p.x-11,    y1:p.y-H/2,   y2:p.y+H/2};
        if(d==="top")    return {x1:p.x-w/2,  x2:p.x+w/2,   y1:p.y-13-H,  y2:p.y-13};
        return                  {x1:p.x-w/2,  x2:p.x+w/2,   y1:p.y+13,    y2:p.y+13+H};
    }

    function hit(a,b){
        return a.x1<b.x2 && a.x2>b.x1 && a.y1<b.y2 && a.y2>b.y1;
    }

    // จุดของทุกหมุดถือเป็นสิ่งกีดขวางเล็กๆ
    const dots = pts.map(q=>({x1:q.p.x-11,x2:q.p.x+11,y1:q.p.y-11,y2:q.p.y+11}));

    pts.forEach((q,k)=>{

        const w = labelText(q.it).length*11 + 22;
        let best = null;

        for(const d of DIRS){
            const r = rect(q.p,d,w);
            const clash = placed.some(o=>hit(r,o)) ||
                          dots.some((o,j)=>j!==k && hit(r,o));
            if(!clash){ best = {d,r}; break; }
        }

        if(!best) best = {d:"right", r:rect(q.p,"right",w)};
        placed.push(best.r);

        const tip = q.it.marker.getTooltip();
        tip.options.direction = best.d;
        tip.options.offset = {
            right:[11,0], left:[-11,0], top:[0,-11], bottom:[0,11]
        }[best.d];
        q.it.marker.closeTooltip();
        q.it.marker.openTooltip();
    });
}

function doPrint(){

    applySheet(curSheet, !autoFit);

    let done = false;
    const go = ()=>{
        if(done) return;
        done = true;
        window.print();
    };

    // รอให้ tile โหลดครบก่อน (สำรอง 5 วินาที)

}

function findLandImages(lat, lng){
    let best = null;
    LAND_IMAGES.forEach(g=>{
        const d = hav({lat,lng}, g);
        if(d<=0.5 && (!best || d<best.d)) best = {d, g};

    const plan = [], photos = [];

}

function parseCSV(text){
    const rows = [];
    let row = [], f = "", q = false;
    for(let i=0;i<text.length;i++){
        const c = text[i];
        if(q){
            if(c==='"'){
                if(text[i+1]==='"'){ f+='"'; i++; }
                else q = false;
            }else f += c;
        }else{
            if(c==='"') q = true;
            else if(c===','){ row.push(f); f=""; }
            else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=""; }
            else if(c!=='\r') f += c;
        }
    }
    if(f!=="" || row.length){ row.push(f); rows.push(row); }
    return rows;
}

// แปลงแถวชีต -> object โดยอ้างอิงชื่อหัวคอลัมน์ (ย้ายคอลัมน์ได้ไม่พัง)
function csvToLand(text){
    const rows = parseCSV(text).filter(r=>r.some(v=>v.trim()!==""));
    if(rows.length<2) return [];
    const h = rows[0].map(x=>x.trim());
    const col = (...names)=>h.findIndex(x=>names.some(n=>x.indexOf(n)>=0));
    const c = {
        no:col("ลำดับ"), name:col("ชื่อ"), coord:col("พิกัด"),
        tambon:col("ตำบล"), amphoe:col("อำเภอ"), detail:col("รายละเอียด"),
        price:col("ราคา"), zone:col("ผังเมือง")
    };
    const g = (r,k)=> c[k]>=0 ? (r[c[k]]||"").trim() : "";
    return rows.slice(1).map(r=>({
        no:g(r,"no"), name:g(r,"name"), coord:g(r,"coord"),
        tambon:g(r,"tambon"), amphoe:g(r,"amphoe"), detail:g(r,"detail"),
        price:g(r,"price"), zone:g(r,"zone")
    }));
}

function esc(s){

            {maxWidth:340, minWidth:300}
        );

        ok++;
    });

    buildList("land","listLand");
    refreshAll();
    return {ok, bad};
}

function loadLand(){

    const msg = document.getElementById("landMsg");
    msg.textContent = "กำลังโหลดจาก Google Sheet…";

    fetch(LAND_CSV_URL + "&t=" + Date.now())
    .then(r=>{
        if(!r.ok) throw new Error(r.status);
        return r.text();
    })
    .then(t=>{
        const list = csvToLand(t);
        if(!list.length) throw new Error("ชีตว่าง");
        const r = addLand(list);
        msg.textContent = "โหลดจากชีตแล้ว " + r.ok + " แปลง" +
            (r.bad.length ? " (พิกัดผิด: ลำดับ "+r.bad.join(", ")+")" : "");
    })
    .catch(err=>{
        console.warn("โหลดชีตที่ดินไม่สำเร็จ:", err);
        const r = addLand(LAND_FALLBACK);
        msg.textContent = "โหลดชีตไม่ได้ ใช้ข้อมูลสำรอง " + r.ok + " แปลง";
    });
}


/* ---------- เริ่มต้น ---------- */

buildList("station","listStation");
buildList("target","listTarget");
showScenario("all");
loadLand();

</script>
